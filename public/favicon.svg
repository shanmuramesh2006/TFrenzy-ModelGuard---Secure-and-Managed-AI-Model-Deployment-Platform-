<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00F0FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563EB;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="32" cy="32" r="32" fill="#07090E"/>
  
  <!-- Outer shield border -->
  <path d="M 32 8 L 50 18 L 50 38 Q 32 54 32 54 Q 14 54 14 38 L 14 18 Z" 
        fill="none" stroke="url(#shieldGrad)" stroke-width="2.5"/>
  
  <!-- Inner shield -->
  <path d="M 32 12 L 47 20 L 47 37 Q 32 50 32 50 Q 17 50 17 37 L 17 20 Z" 
        fill="#07090E" opacity="0.8"/>
  
  <!-- Center lock icon -->
  <g transform="translate(32, 32)">
    <!-- Lock body -->
    <rect x="-6" y="-2" width="12" height="10" rx="1" fill="none" stroke="url(#shieldGrad)" stroke-width="1.5"/>
    
    <!-- Lock top arc -->
    <path d="M -4 -2 Q -4 -6 0 -6 Q 4 -6 4 -2" fill="none" stroke="url(#shieldGrad)" stroke-width="1.5"/>
    
    <!-- Keyhole -->
    <circle cx="0" cy="2" r="1.5" fill="#00F0FF" opacity="0.8"/>
  </g>
  
  <!-- Accent dots -->
  <circle cx="20" cy="20" r="1.5" fill="#00F0FF" opacity="0.6"/>
  <circle cx="44" cy="20" r="1.5" fill="#2563EB" opacity="0.6"/>
  <circle cx="32" cy="58" r="1.5" fill="#00F0FF" opacity="0.4"/>
</svg>
