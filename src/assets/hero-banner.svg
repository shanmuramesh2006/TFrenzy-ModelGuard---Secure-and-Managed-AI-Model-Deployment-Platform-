<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg" className="w-full h-auto">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0E1424;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#10182C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0A1120;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00F0FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563EB;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGradient)"/>
  
  <!-- Decorative circles -->
  <circle cx="1100" cy="50" r="150" fill="#00F0FF" opacity="0.05"/>
  <circle cx="100" cy="350" r="120" fill="#2563EB" opacity="0.08"/>
  
  <!-- Grid pattern -->
  <g stroke="#1E2638" stroke-width="1" opacity="0.3">
    <line x1="0" y1="0" x2="1200" y2="0"/>
    <line x1="0" y1="50" x2="1200" y2="50"/>
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="250" x2="1200" y2="250"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
  </g>
  
  <!-- Shield icon on right -->
  <g transform="translate(1000, 60)">
    <path d="M 0 0 L 100 0 L 100 60 Q 50 100 0 120 Q 50 100 0 60 Z" fill="none" stroke="#00F0FF" stroke-width="3" opacity="0.4"/>
  </g>
  
  <!-- Title -->
  <text x="60" y="80" font-size="48" font-weight="bold" fill="#FFFFFF" font-family="Arial, sans-serif">
    TFrenzy ModelGuard
  </text>
  
  <!-- Subtitle -->
  <text x="60" y="130" font-size="20" fill="#00F0FF" font-family="Arial, sans-serif">
    AI Studio - Advanced Model Security &amp; Protection
  </text>
  
  <!-- Description -->
  <text x="60" y="170" font-size="14" fill="#9CA3AF" font-family="Arial, sans-serif">
    Secure deployment, encryption & device authorization for TensorRT models on Jetson
  </text>
  
  <!-- Status badges -->
  <g transform="translate(60, 210)">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="140" height="35" rx="6" fill="#00F0FF" opacity="0.1" stroke="#00F0FF" stroke-width="1"/>
    <text x="70" y="23" font-size="12" fill="#00F0FF" text-anchor="middle" font-weight="bold">âœ“ AES-256 Encryption</text>
    
    <!-- Badge 2 -->
    <rect x="160" y="0" width="140" height="35" rx="6" fill="#2563EB" opacity="0.1" stroke="#2563EB" stroke-width="1"/>
    <text x="230" y="23" font-size="12" fill="#2563EB" text-anchor="middle" font-weight="bold">âœ“ RSA-3072 Signed</text>
    
    <!-- Badge 3 -->
    <rect x="320" y="0" width="150" height="35" rx="6" fill="#00F0FF" opacity="0.1" stroke="#00F0FF" stroke-width="1"/>
    <text x="395" y="23" font-size="12" fill="#00F0FF" text-anchor="middle" font-weight="bold">âœ“ Device Authorized</text>
  </g>
  
  <!-- Bottom accent line -->
  <line x1="0" y1="390" x2="1200" y2="390" stroke="url(#accentGradient)" stroke-width="3" opacity="0.6"/>
</svg>

